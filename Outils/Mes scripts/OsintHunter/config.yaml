# OSINT Hunter v5.0 — Configuration
# Les variables d'environnement OSINT_* surchargent ces valeurs.

general:
  version: "5.0.0"
  language: "fr"                 # fr | en
  output_dir: "./reports"
  max_workers: 40
  default_timeout: 12
  cache_ttl: 3600                # secondes (0 = désactivé)

proxy:
  enabled: false
  url: ""                        # socks5://127.0.0.1:9050 pour Tor
  rotate: false

api_keys:
  hibp: ""                       # ou env OSINT_HIBP_API_KEY
  shodan: ""                     # ou env OSINT_SHODAN_API_KEY
  hunter_io: ""                  # ou env OSINT_HUNTER_IO_KEY
  dehashed_email: ""             # ou env OSINT_DEHASHED_EMAIL
  dehashed_key: ""               # ou env OSINT_DEHASHED_KEY
  virustotal: ""                 # ou env OSINT_VT_API_KEY
  numverify: ""                  # ou env OSINT_NUMVERIFY_KEY
  epieos: ""                     # ou env OSINT_EPIEOS_KEY
  github: ""                     # ou env OSINT_GITHUB_TOKEN

deep_verify:
  enabled: true
  workers: 30
  timeout: 12
  strict_mode: false             # true = élimine LOW confidence

api_server:
  host: "127.0.0.1"
  port: 8400
  cors_origins: ["http://localhost:3000"]
  api_key: ""                    # si defini (ou env OSINT_API_KEY), exige X-API-Key sur /scan et DELETE /cache

database:
  path: "./osint_hunter.db"

correlation:
  avatar_comparison: true
  bio_similarity: true
  link_extraction: true
  similarity_threshold: 0.75
